name: Native platform checks

on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating system label on the runner
        required: true
        type: choice
        options: [Linux, macOS, Windows]
      arch:
        description: Architecture label on the runner
        required: true
        type: choice
        options: [X64, ARM64]

permissions:
  contents: read

jobs:
  native:
    runs-on: [self-hosted, "${{ inputs.os }}", "${{ inputs.arch }}"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test the CLI and credential permissions
        shell: bash
        run: bash scripts/test.sh
      - name: Save, read, and remove a test keyring entry
        shell: bash
        env:
          DEPLEXO_TEST_NATIVE_KEYRING: "1"
        run: go test ./internal/credentials -run '^TestNativeKeyring$' -count=1 -v
      - name: Test native installer behavior
        shell: bash
        run: go test ./scripts -count=1 -v
      - name: Build and execute the packaged binary
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: go run scripts/package.go -commit "$SOURCE_COMMIT"
