name: Native platform checks

on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted platform to verify
        required: true
        type: choice
        options: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-native-keyring
      - name: Test the CLI and credential permissions
        shell: bash
        run: bash scripts/test.sh
      - name: Save, read, and remove a test keyring entry
        shell: bash
        env:
          DEPLEXO_TEST_NATIVE_KEYRING: "1"
        run: go test ./internal/credentials -run '^TestNativeKeyring$' -count=1 -v
      - name: Test native installer behavior
        shell: bash
        run: go test ./scripts -count=1 -v
      - name: Build and execute the packaged binary
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: go run scripts/package.go -commit "$SOURCE_COMMIT"
